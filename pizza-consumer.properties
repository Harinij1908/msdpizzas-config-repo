server.port=8082
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Resilience4j - Circuit Breaker (half-open state only)
resilience4j.circuitbreaker.instances.pizzaProducer.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.pizzaProducer.sliding-window-size=5
resilience4j.circuitbreaker.instances.pizzaProducer.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.pizzaProducer.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.pizzaProducer.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.pizzaProducer.automatic-transition-from-open-to-half-open-enabled=true

# Timeout - 3 seconds as per requirement
resilience4j.timelimiter.instances.pizzaProducer.timeout-duration=3s

feign.client.config.default.connect-timeout=3000
feign.client.config.default.read-timeout=3000
feign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.enabled=true

logging.file.name=logs/pizza-consumer.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.msdpizzas=DEBUG
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
spring.cloud.openfeign.micrometer.enabled=true

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
